# Lint, test and cross-compile on every push. ghu is pure Go built with
# CGO_ENABLED=0, so one Linux runner produces every platform it ships; a macOS
# or Windows runner would cost minutes without checking anything more.
name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # make lint shells out to scripts/order.py for the declaration order, so
      # the runner needs python3. The ubuntu images ship it.
      - run: make lint
      - run: make test

      # The same command release.yml runs. ghu has no build tags and no
      # runtime.GOOS, so this is not really about the code compiling
      # elsewhere -- it is so a tag is never the first time the release path
      # itself is exercised.
      - run: make release
