# Publishes a release when a v* tag is pushed. make release already
# cross-compiles every platform and writes SHA256SUMS, so this workflow only
# has to check the tag, run it, and attach what it produced.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make lint
      - run: make test
      - run: make release

      # The version is the `version` constant in internal/cli/version.go.
      # Checking the tag against what the built binary prints, rather than
      # against the source, covers the constant, the build and `ghu version`
      # in one step -- a mismatch would publish binaries whose version is a lie.
      - name: Tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built="$(./bin/ghu-linux-amd64 version)"
          test "$built" = "${GITHUB_REF_NAME#v}" \
            || { echo "tag ${GITHUB_REF_NAME}, but the binary reports $built"; exit 1; }

      # A dispatch run has no tag to check against, so just prove it runs.
      - run: ./bin/ghu-linux-amd64 version

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: bin/*
