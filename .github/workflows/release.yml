# Publishes a release when a v* tag is pushed. make release already
# cross-compiles every platform and writes SHA256SUMS, so this workflow only
# has to check the tag, run it, and attach what it produced.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make lint
      - run: make test

      # The tag is the version, and the only place it is written. A dispatch
      # run has no tag, so VERSION stays empty and those binaries report
      # "dev" -- nothing is being published from them.
      - name: Build
        run: |
          v=""
          case "${{ github.ref }}" in refs/tags/v*) v="${GITHUB_REF_NAME#v}" ;; esac
          make release VERSION="$v"

      # -X does nothing at all if its symbol path is wrong, and says nothing
      # about it, so this checks the stamp arrived rather than checking two
      # copies of the version against each other.
      - name: The version stamp landed
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built="$(./bin/ghu-linux-amd64 version)"
          test "$built" = "${GITHUB_REF_NAME#v}" \
            || { echo "tag ${GITHUB_REF_NAME}, but the binary reports $built"; exit 1; }

      - run: ./bin/ghu-linux-amd64 version

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: bin/*
